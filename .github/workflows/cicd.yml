name: Flask Secure CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: shepherd777/cicd-flask-app

jobs:

  # JOB 1: Code quality and application testing
  quality:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Check source files
        run: |
          test -f app/app.py
          test -f requirements.txt
          test -f Dockerfile

      - name: Python linting
        run: ruff check app tests

      - name: Unit testing
        run: pytest -v tests/unit

      - name: Integration testing
        run: pytest -v tests/integration


  # JOB 2: Secrets detection
  secrets-scan:
    name: Git Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # JOB 3: Dependency scanning and SAST
  security:
    name: Dependency Scan and SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Static application security testing
        run: bandit -r app -ll


  # JOB 4: Dockerfile security
  dockerfile-scan:
    name: Dockerfile Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Dockerfile
        run: checkov --file Dockerfile --framework dockerfile


  # JOB 5: Build, scan and publish container
  container:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    needs:
      - quality
      - secrets-scan
      - security
      - dockerfile-scan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --no-cache \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: shepherd777/cicd-flask-app:${{ github.sha }}
          scan-type: image
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Extract Short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV        

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} \
            ${{ env.IMAGE_NAME }}:latest

      - name: Push image to Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          docker push ${{ env.IMAGE_NAME }}:latest

