name: Simple CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  simple-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint with ruff
        uses: astral-sh/ruff-action@v3

      - name: Unit test with pytest
        run: pytest
